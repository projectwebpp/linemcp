<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🦇 LINE Bot - Dark Gothic</title>
    <style>
        /* ===== FONTS ===== */
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap');
        
        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Cormorant Garamond', serif;
            background: #0a0a0a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background-image: 
                radial-gradient(ellipse at 50% 0%, #1a0a0a 0%, #0a0a0a 70%);
        }
        
        /* ===== GOTHIC ORNAMENTS ===== */
        .gothic-border {
            position: relative;
        }
        
        .gothic-border::before,
        .gothic-border::after {
            content: '⚜';
            position: absolute;
            font-size: 24px;
            color: #8b0000;
            opacity: 0.3;
        }
        
        /* ===== MAIN CONTAINER ===== */
        .app-container {
            width: 100%;
            max-width: 560px;
            background: linear-gradient(145deg, #1a0f0f, #0d0808);
            border: 2px solid #2a0a0a;
            border-radius: 12px;
            padding: 28px 24px 24px;
            box-shadow: 
                0 0 40px rgba(139, 0, 0, 0.15),
                inset 0 0 60px rgba(139, 0, 0, 0.05),
                0 20px 60px rgba(0,0,0,0.8);
            position: relative;
        }
        
        .app-container::before {
            content: '';
            position: absolute;
            top: -1px;
            left: 20%;
            right: 20%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #8b0000, transparent);
        }
        
        .app-container::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 20%;
            right: 20%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #8b0000, transparent);
        }
        
        /* ===== HEADER ===== */
        .header {
            text-align: center;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(139, 0, 0, 0.3);
            margin-bottom: 20px;
            position: relative;
        }
        
        .header::after {
            content: '✦ ✦ ✦';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            background: #0d0808;
            padding: 0 12px;
            font-size: 10px;
            color: #8b0000;
            letter-spacing: 8px;
        }
        
        .header-icon {
            font-size: 36px;
            display: block;
            margin-bottom: 6px;
        }
        
        .header h1 {
            font-family: 'Cinzel', serif;
            font-weight: 900;
            font-size: 22px;
            color: #c0392b;
            text-shadow: 0 0 30px rgba(139, 0, 0, 0.3);
            letter-spacing: 6px;
            text-transform: uppercase;
        }
        
        .header .subtitle {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-size: 14px;
            color: rgba(139, 0, 0, 0.5);
            letter-spacing: 4px;
            margin-top: 2px;
        }
        
        .status-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin-top: 10px;
            font-size: 12px;
            color: rgba(139, 0, 0, 0.6);
            font-family: 'Cinzel', serif;
            letter-spacing: 2px;
        }
        
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #8b0000;
            display: inline-block;
            animation: pulse-red 2s ease-in-out infinite;
        }
        
        .status-dot.online {
            background: #27ae60;
            animation: pulse-green 2s ease-in-out infinite;
        }
        
        @keyframes pulse-red {
            0%, 100% { opacity: 0.3; box-shadow: 0 0 0 0 rgba(139,0,0,0.2); }
            50% { opacity: 1; box-shadow: 0 0 20px rgba(139,0,0,0.4); }
        }
        
        @keyframes pulse-green {
            0%, 100% { opacity: 0.3; box-shadow: 0 0 0 0 rgba(39,174,96,0.2); }
            50% { opacity: 1; box-shadow: 0 0 20px rgba(39,174,96,0.4); }
        }
        
        /* ===== CONFIG SECTION ===== */
        .config-section {
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(139, 0, 0, 0.15);
            border-radius: 8px;
            padding: 14px 16px;
            margin-bottom: 16px;
        }
        
        .config-section label {
            display: block;
            font-family: 'Cinzel', serif;
            font-size: 10px;
            color: rgba(139, 0, 0, 0.6);
            letter-spacing: 2px;
            margin-bottom: 4px;
            text-transform: uppercase;
        }
        
        .config-row {
            display: flex;
            gap: 10px;
        }
        
        .config-row input {
            flex: 1;
            background: #0a0505;
            border: 1px solid rgba(139, 0, 0, 0.2);
            border-radius: 6px;
            padding: 10px 14px;
            color: #c0392b;
            font-family: 'Cormorant Garamond', serif;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }
        
        .config-row input::placeholder {
            color: rgba(139, 0, 0, 0.2);
            font-style: italic;
        }
        
        .config-row input:focus {
            border-color: #8b0000;
            box-shadow: 0 0 20px rgba(139, 0, 0, 0.1);
        }
        
        .config-row button {
            padding: 10px 20px;
            background: linear-gradient(135deg, #1a0a0a, #2a0a0a);
            border: 1px solid #8b0000;
            border-radius: 6px;
            color: #8b0000;
            font-family: 'Cinzel', serif;
            font-size: 10px;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.3s;
            white-space: nowrap;
        }
        
        .config-row button:hover {
            background: #8b0000;
            color: #0a0505;
            box-shadow: 0 0 30px rgba(139, 0, 0, 0.2);
        }
        
        /* ===== AI MODEL SELECTOR ===== */
        .model-selector {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
            padding: 8px 0 4px;
        }
        
        .model-selector label {
            font-family: 'Cinzel', serif;
            font-size: 9px;
            color: rgba(139, 0, 0, 0.5);
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        
        .model-selector select {
            background: #0a0505;
            border: 1px solid rgba(139, 0, 0, 0.2);
            border-radius: 6px;
            padding: 6px 12px;
            color: #8b0000;
            font-family: 'Cormorant Garamond', serif;
            font-size: 13px;
            outline: none;
            cursor: pointer;
        }
        
        .model-selector select:focus {
            border-color: #8b0000;
        }
        
        .model-selector select option {
            background: #0a0505;
            color: #8b0000;
        }
        
        /* ===== CHAT AREA ===== */
        .chat-area {
            background: rgba(0,0,0,0.4);
            border: 1px solid rgba(139, 0, 0, 0.1);
            border-radius: 8px;
            padding: 16px;
            height: 320px;
            overflow-y: auto;
            margin-bottom: 16px;
        }
        
        .chat-area::-webkit-scrollbar {
            width: 4px;
        }
        
        .chat-area::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.3);
            border-radius: 4px;
        }
        
        .chat-area::-webkit-scrollbar-thumb {
            background: #8b0000;
            border-radius: 4px;
        }
        
        /* ===== MESSAGES ===== */
        .message {
            margin-bottom: 12px;
            display: flex;
            align-items: flex-end;
            animation: fadeIn 0.4s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .message.sent {
            justify-content: flex-end;
        }
        
        .message.received {
            justify-content: flex-start;
        }
        
        .message-bubble {
            max-width: 80%;
            padding: 10px 16px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.6;
            position: relative;
        }
        
        .message.sent .message-bubble {
            background: linear-gradient(135deg, #1a0a0a, #2a0f0f);
            border: 1px solid rgba(139, 0, 0, 0.3);
            color: #c0392b;
            border-bottom-right-radius: 4px;
        }
        
        .message.received .message-bubble {
            background: rgba(26, 10, 10, 0.6);
            border: 1px solid rgba(139, 0, 0, 0.15);
            color: #a0524a;
            border-bottom-left-radius: 4px;
        }
        
        .message-bubble .time {
            font-size: 9px;
            color: rgba(139, 0, 0, 0.3);
            margin-top: 4px;
            display: block;
            font-family: 'Cinzel', serif;
            letter-spacing: 1px;
        }
        
        .message-bubble .meta {
            font-size: 9px;
            color: rgba(139, 0, 0, 0.4);
            margin-top: 2px;
            display: block;
            font-style: italic;
        }
        
        /* ===== TYPING ===== */
        .typing-indicator {
            padding: 10px 16px;
            background: rgba(26, 10, 10, 0.6);
            border: 1px solid rgba(139, 0, 0, 0.15);
            border-radius: 12px;
            display: inline-block;
            border-bottom-left-radius: 4px;
        }
        
        .typing-dots {
            display: flex;
            gap: 6px;
        }
        
        .typing-dots span {
            width: 8px;
            height: 8px;
            background: #8b0000;
            border-radius: 50%;
            display: block;
            animation: typingBounce 1.4s ease-in-out infinite;
        }
        
        .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
        .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
        
        @keyframes typingBounce {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.3; }
            30% { transform: translateY(-8px); opacity: 1; }
        }
        
        /* ===== INPUT ===== */
        .input-area {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .input-row {
            display: flex;
            gap: 10px;
        }
        
        .input-row input {
            flex: 1;
            background: #0a0505;
            border: 1px solid rgba(139, 0, 0, 0.2);
            border-radius: 8px;
            padding: 12px 16px;
            color: #c0392b;
            font-family: 'Cormorant Garamond', serif;
            font-size: 16px;
            outline: none;
            transition: all 0.3s;
        }
        
        .input-row input::placeholder {
            color: rgba(139, 0, 0, 0.2);
            font-style: italic;
        }
        
        .input-row input:focus {
            border-color: #8b0000;
            box-shadow: 0 0 30px rgba(139, 0, 0, 0.1);
        }
        
        .input-row button {
            padding: 12px 28px;
            background: linear-gradient(135deg, #1a0a0a, #2a0a0a);
            border: 1px solid #8b0000;
            border-radius: 8px;
            color: #8b0000;
            font-family: 'Cinzel', serif;
            font-size: 11px;
            letter-spacing: 3px;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
        }
        
        .input-row button:hover:not(:disabled) {
            background: #8b0000;
            color: #0a0505;
            box-shadow: 0 0 30px rgba(139, 0, 0, 0.2);
            transform: scale(0.98);
        }
        
        .input-row button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        
        /* ===== TOOLS BAR ===== */
        .tools-bar {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            padding-top: 4px;
        }
        
        .tools-bar button {
            padding: 6px 14px;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(139, 0, 0, 0.15);
            border-radius: 6px;
            color: rgba(139, 0, 0, 0.5);
            font-family: 'Cinzel', serif;
            font-size: 8px;
            letter-spacing: 1.5px;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
        }
        
        .tools-bar button:hover {
            background: rgba(139, 0, 0, 0.15);
            border-color: #8b0000;
            color: #c0392b;
        }
        
        .tools-bar button.ai-btn {
            border-color: rgba(139, 0, 0, 0.3);
            color: #8b0000;
        }
        
        .tools-bar button.ai-btn:hover {
            background: rgba(139, 0, 0, 0.2);
            border-color: #8b0000;
        }
        
        /* ===== TOAST ===== */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #1a0f0f;
            border: 1px solid #8b0000;
            border-radius: 8px;
            padding: 12px 24px;
            color: #c0392b;
            font-family: 'Cormorant Garamond', serif;
            font-size: 14px;
            opacity: 0;
            transition: all 0.4s ease;
            z-index: 1000;
            pointer-events: none;
            max-width: 90%;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
        }
        
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        
        .toast.error {
            border-color: #8b0000;
            color: #c0392b;
        }
        
        .toast.success {
            border-color: #27ae60;
            color: #27ae60;
        }
        
        /* ===== MODAL ===== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.85);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            backdrop-filter: blur(4px);
        }
        
        .modal-overlay.show {
            display: flex;
        }
        
        .modal {
            background: linear-gradient(145deg, #1a0f0f, #0d0808);
            border: 1px solid #2a0a0a;
            border-radius: 12px;
            padding: 28px;
            max-width: 480px;
            width: 92%;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0,0,0,0.9);
        }
        
        .modal h3 {
            font-family: 'Cinzel', serif;
            font-weight: 700;
            font-size: 16px;
            color: #8b0000;
            letter-spacing: 4px;
            margin-bottom: 16px;
            text-transform: uppercase;
            text-align: center;
        }
        
        .modal textarea {
            width: 100%;
            min-height: 160px;
            padding: 14px;
            background: #0a0505;
            border: 1px solid rgba(139, 0, 0, 0.2);
            border-radius: 8px;
            color: #c0392b;
            font-family: 'Cormorant Garamond', serif;
            font-size: 14px;
            resize: vertical;
            outline: none;
        }
        
        .modal textarea:focus {
            border-color: #8b0000;
        }
        
        .modal-actions {
            display: flex;
            gap: 12px;
            margin-top: 18px;
            justify-content: flex-end;
        }
        
        .modal-actions button {
            padding: 10px 24px;
            border-radius: 6px;
            font-family: 'Cinzel', serif;
            font-size: 10px;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
        }
        
        .modal-actions .btn-primary {
            background: linear-gradient(135deg, #1a0a0a, #2a0a0a);
            border: 1px solid #8b0000;
            color: #8b0000;
        }
        
        .modal-actions .btn-primary:hover {
            background: #8b0000;
            color: #0a0505;
        }
        
        .modal-actions .btn-secondary {
            background: transparent;
            border: 1px solid rgba(139, 0, 0, 0.2);
            color: rgba(139, 0, 0, 0.4);
        }
        
        .modal-actions .btn-secondary:hover {
            border-color: #8b0000;
            color: #8b0000;
        }
        
        /* ===== RESPONSIVE ===== */
        @media (max-width: 480px) {
            body { padding: 10px; }
            .app-container { padding: 16px; }
            .header h1 { font-size: 17px; letter-spacing: 3px; }
            .chat-area { height: 240px; }
            .input-row input { font-size: 14px; padding: 10px 14px; }
            .input-row button { padding: 10px 18px; font-size: 9px; }
            .config-row input { font-size: 12px; }
            .tools-bar button { font-size: 7px; padding: 4px 10px; }
        }
        
        /* ===== SCROLLBAR ===== */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #0a0505;
        }
        ::-webkit-scrollbar-thumb {
            background: #8b0000;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- HEADER -->
        <div class="header">
            <span class="header-icon">🦇</span>
            <h1>Dark Bot</h1>
            <div class="subtitle">— LINE Messaging Interface —</div>
            <div class="status-bar">
                <span class="status-dot" id="statusDot"></span>
                <span id="statusText">INITIALIZING</span>
                <span style="opacity:0.3;">|</span>
                <span id="aiStatus">AI: ⚡</span>
            </div>
        </div>

        <!-- CONFIG -->
        <div class="config-section">
            <label>🔗 Web App Endpoint</label>
            <div class="config-row">
                <input type="text" id="webAppUrl" 
                       placeholder="https://script.google.com/macros/s/AKfycbxdXiV1F95c6d7uWz-3T7wqqiJK_EKjyMGHNyuJTv5umihRDz1Q0j7pPdnFcBUUCc0peA/exec">
                <button onclick="saveConfig()">SET</button>
            </div>
        </div>

        <!-- AI MODEL -->
        <div class="model-selector">
            <label>🤖 Model</label>
            <select id="aiModelSelect">
                <option value="gemini-1.5-flash">⚡ Flash</option>
                <option value="gemini-1.5-pro">💎 Pro</option>
                <option value="gemini-1.0-pro">🔮 1.0 Pro</option>
            </select>
            <label style="margin-left:8px;">🌡️</label>
            <select id="aiTempSelect">
                <option value="0.3">❄️ Cool</option>
                <option value="0.7" selected>🌤️ Balanced</option>
                <option value="1.0">🔥 Creative</option>
            </select>
        </div>

        <!-- CHAT -->
        <div class="chat-area" id="chatArea">
            <div class="message received">
                <div class="message-bubble">
                    Welcome, traveler.<br>
                    <span style="font-size:12px;opacity:0.6;">
                        Set your Web App URL and begin.
                    </span>
                </div>
            </div>
        </div>

        <!-- INPUT -->
        <div class="input-area">
            <div class="input-row">
                <input type="text" id="messageInput" 
                       placeholder="Type your message..."
                       onkeypress="if(event.key === 'Enter') sendMessage()">
                <button id="sendBtn" onclick="sendMessage()">Send</button>
            </div>
            <div class="tools-bar">
                <button onclick="sendWithAI()" class="ai-btn">🤖 AI Reply</button>
                <button onclick="sendFlexMessage()">📊 Flex</button>
                <button onclick="broadcastMessage()">📢 Broad</button>
                <button onclick="getProfile()">👤 Profile</button>
                <button onclick="getFollowers()">👥 Follow</button>
                <button onclick="getQuota()">📊 Quota</button>
                <button onclick="showFlexBuilder()">✏️ Build</button>
                <button onclick="clearChat()">🗑️ Clear</button>
            </div>
        </div>
    </div>

    <!-- MODAL -->
    <div class="modal-overlay" id="flexModal">
        <div class="modal">
            <h3>✧ Flex Builder ✧</h3>
            <textarea id="flexJsonInput" placeholder='{"type":"bubble","body":{"type":"box","layout":"vertical","contents":[{"type":"text","text":"Hello!"}]}}'></textarea>
            <div class="modal-actions">
                <button class="btn-secondary" onclick="closeFlexBuilder()">Cancel</button>
                <button class="btn-primary" onclick="sendCustomFlex()">Send</button>
            </div>
        </div>
    </div>

    <!-- TOAST -->
    <div class="toast" id="toast"></div>

    <script>
        // ===== CONFIG =====
        const AI_MODELS = {
            'gemini-1.5-flash': '⚡ Flash',
            'gemini-1.5-pro': '💎 Pro',
            'gemini-1.0-pro': '🔮 1.0 Pro'
        };

        // ===== DOM REFS =====
        const chatArea = document.getElementById('chatArea');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const aiModelSelect = document.getElementById('aiModelSelect');
        const aiTempSelect = document.getElementById('aiTempSelect');
        const webAppUrlInput = document.getElementById('webAppUrl');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const aiStatus = document.getElementById('aiStatus');

        // ===== STORAGE =====
        function loadConfig() {
            const saved = localStorage.getItem('darkBotWebAppUrl');
            if (saved) {
                webAppUrlInput.value = saved;
                setTimeout(checkStatus, 1000);
            }
        }

        function saveConfig() {
            const url = webAppUrlInput.value.trim();
            if (url) {
                localStorage.setItem('darkBotWebAppUrl', url);
                showToast('⚜ Endpoint set', 'success');
                checkStatus();
            } else {
                showToast('⚠️ Please enter a valid URL', 'error');
            }
        }

        function getWebAppUrl() {
            let url = webAppUrlInput.value.trim();
            if (!url) {
                url = localStorage.getItem('darkBotWebAppUrl') || '';
            }
            return url;
        }

        // ===== API CALL =====
        async function callWebApp(action, payload = {}) {
            const url = getWebAppUrl();
            if (!url) {
                throw new Error('⚠️ Please set Web App URL first');
            }

            const response = await fetch(url, {
                method: 'POST',
                mode: 'cors',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    action: action,
                    payload: payload
                })
            });

            if (!response.ok) {
                const text = await response.text();
                throw new Error(`HTTP ${response.status}: ${text}`);
            }

            return await response.json();
        }

        // ===== UTILITY =====
        function getTimestamp() {
            const now = new Date();
            return String(now.getHours()).padStart(2, '0') + ':' +
                   String(now.getMinutes()).padStart(2, '0');
        }

        function showToast(message, type = 'info') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast ' + type;
            toast.classList.add('show');
            clearTimeout(toast._timer);
            toast._timer = setTimeout(() => toast.classList.remove('show'), 3000);
        }

        function addMessage(text, type = 'received', meta = '') {
            const div = document.createElement('div');
            div.className = `message ${type}`;
            div.innerHTML = `
                <div class="message-bubble">
                    ${text}
                    ${meta ? `<span class="meta">${meta}</span>` : ''}
                    <span class="time">${getTimestamp()}</span>
                </div>
            `;
            chatArea.appendChild(div);
            chatArea.scrollTop = chatArea.scrollHeight;
            return div;
        }

        function addTyping() {
            const div = document.createElement('div');
            div.className = 'message received';
            div.id = 'typingIndicator';
            div.innerHTML = `
                <div class="typing-indicator">
                    <div class="typing-dots">
                        <span></span><span></span><span></span>
                    </div>
                </div>
            `;
            chatArea.appendChild(div);
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        function removeTyping() {
            const typing = document.getElementById('typingIndicator');
            if (typing) typing.remove();
        }

        function setStatus(status, ai = null) {
            statusText.textContent = status;
            if (status === 'ONLINE') {
                statusDot.className = 'status-dot online';
            } else {
                statusDot.className = 'status-dot';
            }
            if (ai) {
                aiStatus.textContent = 'AI: ' + ai;
            }
        }

        // ===== SEND MESSAGE =====
        async function sendMessage() {
            const text = messageInput.value.trim();
            if (!text) return;

            addMessage(text, 'sent');
            messageInput.value = '';
            sendBtn.disabled = true;

            try {
                const data = await callWebApp('sendText', { message: text });
                if (data.success) {
                    addMessage('✓ Delivered', 'received', '📤');
                    showToast('⚜ Message sent', 'success');
                } else {
                    addMessage(`✗ ${data.error || 'Failed'}`, 'received');
                    showToast('✗ Send failed', 'error');
                }
            } catch (error) {
                addMessage(`✗ ${error.message}`, 'received');
                showToast('✗ Connection error', 'error');
            } finally {
                sendBtn.disabled = false;
            }
        }

        // ===== SEND WITH AI =====
        async function sendWithAI() {
            const text = messageInput.value.trim();
            if (!text) {
                showToast('⚠️ Type a message first', 'error');
                return;
            }

            const model = aiModelSelect.value;
            const modelName = AI_MODELS[model] || model;

            addMessage(`◈ Asking ${modelName}...`, 'sent');
            messageInput.value = '';
            addTyping();

            try {
                const data = await callWebApp('sendWithAI', {
                    message: text,
                    model: model
                });
                removeTyping();

                if (data.success) {
                    addMessage(`◆ ${data.aiResponse}`, 'received', `🧠 ${modelName}`);
                    showToast(`⚜ AI replied`, 'success');
                } else {
                    addMessage(`✗ AI Error: ${data.error}`, 'received');
                    showToast('✗ AI failed', 'error');
                }
            } catch (error) {
                removeTyping();
                addMessage(`✗ ${error.message}`, 'received');
                showToast('✗ AI error', 'error');
            }
        }

        // ===== GET PROFILE =====
        async function getProfile() {
            addMessage('◈ Fetching profile...', 'received');
            addTyping();

            try {
                const data = await callWebApp('getProfile', {});
                removeTyping();

                if (data.success && data.profile) {
                    const p = data.profile;
                    addMessage(`
                        ◆ ${p.displayName || 'N/A'}<br>
                        ◈ ID: ${p.userId || 'N/A'}<br>
                        ◈ Lang: ${p.language || 'N/A'}<br>
                        ◈ Status: ${p.statusMessage || '—'}
                        ${p.pictureUrl ? `<br><img src="${p.pictureUrl}" style="width:32px;border-radius:4px;border:1px solid #8b0000;margin-top:4px;">` : ''}
                    `, 'received', '👤 Profile');
                    showToast('⚜ Profile loaded', 'success');
                } else {
                    addMessage(`✗ ${data.error || 'Unknown error'}`, 'received');
                }
            } catch (error) {
                removeTyping();
                addMessage(`✗ ${error.message}`, 'received');
                showToast('✗ Profile error', 'error');
            }
        }

        // ===== GET FOLLOWERS =====
        async function getFollowers() {
            addMessage('◈ Fetching followers...', 'received');
            addTyping();

            try {
                const data = await callWebApp('getFollowers', { limit: 20 });
                removeTyping();

                if (data.success && data.data) {
                    const userIds = data.data.userIds || [];
                    const next = data.data.next || 'END';
                    addMessage(`
                        ◆ ${userIds.length} followers<br>
                        ◈ Next: ${next}<br>
                        ${userIds.slice(0, 5).map(id => `◈ ${id}`).join('<br>')}
                        ${userIds.length > 5 ? `<br>◈ ... +${userIds.length - 5} more` : ''}
                    `, 'received', '👥 Followers');
                    showToast(`⚜ ${userIds.length} followers`, 'success');
                } else {
                    addMessage(`✗ ${data.error || 'Unknown'}`, 'received');
                }
            } catch (error) {
                removeTyping();
                addMessage(`✗ ${error.message}`, 'received');
                showToast('✗ Followers error', 'error');
            }
        }

        // ===== BROADCAST =====
        async function broadcastMessage() {
            const text = prompt('📢 Broadcast message:', 'Dark Bot speaks...');
            if (!text) return;

            addMessage(`◈ Broadcasting: "${text}"`, 'received');
            addTyping();

            try {
                const data = await callWebApp('broadcast', { message: text });
                removeTyping();

                if (data.success) {
                    addMessage('✓ Broadcast sent', 'received');
                    showToast('⚜ Broadcast sent', 'success');
                } else {
                    addMessage(`✗ ${data.error}`, 'received');
                    showToast('✗ Broadcast failed', 'error');
                }
            } catch (error) {
                removeTyping();
                addMessage(`✗ ${error.message}`, 'received');
                showToast('✗ Broadcast error', 'error');
            }
        }

        // ===== SEND FLEX =====
        async function sendFlexMessage() {
            const sampleFlex = {
                type: 'bubble',
                body: {
                    type: 'box',
                    layout: 'vertical',
                    contents: [
                        { type: 'text', text: '🦇 Dark Flex', weight: 'bold', size: 'xl', color: '#8b0000' },
                        { type: 'text', text: 'From the shadows', size: 'sm', color: '#666', margin: 'md' },
                        { type: 'separator', margin: 'md' },
                        { type: 'text', text: '⚜ Gothic Style', size: 'sm', color: '#333', margin: 'md' }
                    ]
                }
            };

            addMessage('◈ Sending Flex...', 'received');
            addTyping();

            try {
                const data = await callWebApp('sendFlex', {
                    altText: 'Dark Flex',
                    contents: JSON.stringify(sampleFlex)
                });
                removeTyping();

                if (data.success) {
                    addMessage('✓ Flex sent', 'received');
                    showToast('⚜ Flex sent', 'success');
                } else {
                    addMessage(`✗ ${data.error}`, 'received');
                    showToast('✗ Flex failed', 'error');
                }
            } catch (error) {
                removeTyping();
                addMessage(`✗ ${error.message}`, 'received');
                showToast('✗ Flex error', 'error');
            }
        }

        // ===== GET QUOTA =====
        async function getQuota() {
            addMessage('◈ Checking quota...', 'received');
            addTyping();

            try {
                const data = await callWebApp('getQuota', {});
                removeTyping();

                if (data.success && data.quota) {
                    const q = data.quota;
                    const remaining = (q.limit != null && q.used != null) ? q.limit - q.used : 'N/A';
                    addMessage(`
                        ◆ Message Quota<br>
                        ◈ Limit: ${q.limit ?? 'N/A'}<br>
                        ◈ Used: ${q.used ?? 'N/A'}<br>
                        ◈ Remaining: ${remaining}
                    `, 'received', '📊 Quota');
                    showToast('⚜ Quota checked', 'success');
                } else {
                    addMessage(`✗ ${data.error || 'Unknown'}`, 'received');
                }
            } catch (error) {
                removeTyping();
                addMessage(`✗ ${error.message}`, 'received');
                showToast('✗ Quota error', 'error');
            }
        }

        // ===== FLEX BUILDER =====
        function showFlexBuilder() {
            document.getElementById('flexModal').classList.add('show');
            document.getElementById('flexJsonInput').value = JSON.stringify({
                type: 'bubble',
                body: {
                    type: 'box',
                    layout: 'vertical',
                    contents: [
                        { type: 'text', text: '🦇 Dark', weight: 'bold', size: 'xl' },
                        { type: 'text', text: 'Flex Message', size: 'sm', color: '#666' }
                    ]
                }
            }, null, 2);
        }

        function closeFlexBuilder() {
            document.getElementById('flexModal').classList.remove('show');
        }

        async function sendCustomFlex() {
            const jsonInput = document.getElementById('flexJsonInput');
            let contentsStr;
            try {
                JSON.parse(jsonInput.value);
                contentsStr = jsonInput.value;
            } catch (e) {
                showToast('✗ Invalid JSON', 'error');
                addMessage(`✗ JSON Error: ${e.message}`, 'received');
                return;
            }

            closeFlexBuilder();
            addMessage('◈ Sending custom Flex...', 'received');
            addTyping();

            try {
                const data = await callWebApp('sendFlex', {
                    altText: 'Custom Flex',
                    contents: contentsStr
                });
                removeTyping();

                if (data.success) {
                    addMessage('✓ Custom Flex sent', 'received');
                    showToast('⚜ Custom flex sent', 'success');
                } else {
                    addMessage(`✗ ${data.error}`, 'received');
                    showToast('✗ Send failed', 'error');
                }
            } catch (error) {
                removeTyping();
                addMessage(`✗ ${error.message}`, 'received');
                showToast('✗ Send error', 'error');
            }
        }

        // ===== CLEAR CHAT =====
        function clearChat() {
            chatArea.innerHTML = `
                <div class="message received">
                    <div class="message-bubble">
                        ◈ Chat cleared<br>
                        <span style="font-size:12px;opacity:0.6;">The shadows remain...</span>
                    </div>
                </div>
            `;
            showToast('🗑️ Chat cleared', 'info');
        }

        // ===== CHECK STATUS =====
        async function checkStatus() {
            try {
                const data = await callWebApp('status', {});
                if (data.status === 'online') {
                    setStatus('ONLINE', data.aiConfigured ? '⚡' : '—');
                } else {
                    setStatus('OFFLINE');
                }
            } catch (e) {
                setStatus('OFFLINE');
                if (getWebAppUrl()) {
                    showToast('⚠️ Server offline', 'error');
                }
            }
        }

        // ===== INIT =====
        loadConfig();
        setStatus('READY');

        // Auto-check after 2s if URL is set
        setTimeout(() => {
            if (getWebAppUrl()) {
                checkStatus();
            }
        }, 2000);

        // ===== KEYBOARD SHORTCUTS =====
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && e.ctrlKey) {
                sendWithAI();
                e.preventDefault();
            }
        });

        console.log('🦇 Dark Bot initialized');
        console.log('⌨️ Ctrl+Enter = AI Reply');
        console.log('🔗 Set your Web App URL above');
    </script>
</body>
</html>
