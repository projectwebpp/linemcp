<!-- index.html - Pixel Art LINE Bot with AI (Standalone) -->
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎮 LINE Bot MCP - Pixel Edition</title>
    <style>
        /* ===== FONTS ===== */
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        
        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            image-rendering: pixelated;
        }
        
        body {
            font-family: 'Press Start 2P', monospace;
            background: #1a1a2e;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        
        /* ===== PIXEL BACKGROUND ===== */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                repeating-linear-gradient(0deg, 
                    transparent, transparent 4px,
                    rgba(255,255,255,0.03) 4px, rgba(255,255,255,0.03) 5px
                ),
                repeating-linear-gradient(90deg, 
                    transparent, transparent 4px,
                    rgba(255,255,255,0.03) 4px, rgba(255,255,255,0.03) 5px
                );
            pointer-events: none;
            z-index: 0;
        }
        
        /* ===== PIXEL BORDER ===== */
        .pixel-border {
            border: 4px solid #4ade80;
            box-shadow: 
                inset 0 0 0 2px #22c55e,
                0 0 0 2px #22c55e,
                0 0 20px rgba(74, 222, 128, 0.3);
            image-rendering: pixelated;
        }
        
        /* ===== APP CONTAINER ===== */
        .app-container {
            width: 100%;
            max-width: 520px;
            height: 95vh;
            background: #16213e;
            border: 6px solid #4ade80;
            border-radius: 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            z-index: 1;
            box-shadow: 
                0 0 0 4px #0f3460,
                0 0 0 8px #4ade80,
                0 20px 60px rgba(0,0,0,0.8);
        }
        
        /* ===== HEADER ===== */
        .header {
            background: linear-gradient(180deg, #0f3460, #16213e);
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 4px solid #4ade80;
            flex-shrink: 0;
            position: relative;
        }
        
        .header::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 0;
            right: 0;
            height: 4px;
            background: repeating-linear-gradient(90deg, #4ade80 0px, #4ade80 8px, transparent 8px, transparent 16px);
        }
        
        .header h1 {
            font-size: 14px;
            color: #4ade80;
            text-shadow: 0 0 20px rgba(74, 222, 128, 0.3);
            display: flex;
            align-items: center;
            gap: 10px;
            letter-spacing: 2px;
        }
        
        .header h1 .pixel-icon {
            font-size: 20px;
            display: inline-block;
            animation: float 2s ease-in-out infinite;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }
        
        .header-status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 8px;
            color: #4ade80;
            background: rgba(74, 222, 128, 0.1);
            padding: 6px 12px;
            border: 2px solid #4ade80;
            image-rendering: pixelated;
        }
        
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 0;
            background: #4ade80;
            box-shadow: 0 0 10px #4ade80;
            animation: blink 1s steps(2) infinite;
        }
        
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.2; }
        }
        
        /* ===== CHAT AREA ===== */
        .chat-area {
            flex: 1;
            padding: 16px 16px 8px;
            overflow-y: auto;
            background: #0a0a1a;
            position: relative;
        }
        
        .chat-area::-webkit-scrollbar {
            width: 8px;
        }
        
        .chat-area::-webkit-scrollbar-track {
            background: #0a0a1a;
            border-left: 2px solid #4ade80;
        }
        
        .chat-area::-webkit-scrollbar-thumb {
            background: #4ade80;
            border: 2px solid #0a0a1a;
            image-rendering: pixelated;
        }
        
        /* ===== MESSAGES ===== */
        .message {
            margin-bottom: 16px;
            display: flex;
            align-items: flex-end;
            animation: pixelSlide 0.3s steps(4) forwards;
        }
        
        @keyframes pixelSlide {
            0% { 
                opacity: 0;
                transform: translateY(10px) scale(0.95);
            }
            100% { 
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        
        .message.sent {
            justify-content: flex-end;
        }
        
        .message.received {
            justify-content: flex-start;
        }
        
        .message-bubble {
            max-width: 80%;
            padding: 12px 16px;
            font-size: 11px;
            line-height: 1.8;
            border: 3px solid;
            image-rendering: pixelated;
            position: relative;
        }
        
        .message.sent .message-bubble {
            background: #4ade80;
            color: #0a0a1a;
            border-color: #22c55e;
            border-right: none;
        }
        
        .message.sent .message-bubble::after {
            content: '';
            position: absolute;
            right: -12px;
            bottom: 8px;
            border-left: 10px solid #4ade80;
            border-top: 10px solid transparent;
            border-bottom: 10px solid transparent;
        }
        
        .message.received .message-bubble {
            background: #1a1a2e;
            color: #4ade80;
            border-color: #4ade80;
            border-left: none;
        }
        
        .message.received .message-bubble::before {
            content: '';
            position: absolute;
            left: -12px;
            bottom: 8px;
            border-right: 10px solid #1a1a2e;
            border-top: 10px solid transparent;
            border-bottom: 10px solid transparent;
        }
        
        .message-meta {
            font-size: 7px;
            color: rgba(74, 222, 128, 0.6);
            margin-top: 4px;
            letter-spacing: 1px;
        }
        
        .timestamp {
            font-size: 7px;
            color: rgba(74, 222, 128, 0.4);
            margin-top: 2px;
            letter-spacing: 0.5px;
        }
        
        /* ===== TYPING INDICATOR ===== */
        .typing-indicator {
            padding: 12px 16px;
            background: #1a1a2e;
            border: 3px solid #4ade80;
            display: inline-block;
            border-left: none;
        }
        
        .typing-dots {
            display: flex;
            gap: 6px;
        }
        
        .typing-dots span {
            width: 10px;
            height: 10px;
            background: #4ade80;
            display: block;
            animation: typingPixels 1s steps(2) infinite;
        }
        
        .typing-dots span:nth-child(2) {
            animation-delay: 0.2s;
        }
        
        .typing-dots span:nth-child(3) {
            animation-delay: 0.4s;
        }
        
        @keyframes typingPixels {
            0%, 100% { opacity: 0.2; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1); }
        }
        
        /* ===== INPUT AREA ===== */
        .input-area {
            padding: 12px 16px 16px;
            background: #0f3460;
            border-top: 4px solid #4ade80;
            flex-shrink: 0;
            position: relative;
        }
        
        .input-area::before {
            content: '';
            position: absolute;
            top: -8px;
            left: 0;
            right: 0;
            height: 4px;
            background: repeating-linear-gradient(90deg, #4ade80 0px, #4ade80 8px, transparent 8px, transparent 16px);
        }
        
        .input-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        
        .input-row input {
            flex: 1;
            padding: 12px 16px;
            background: #0a0a1a;
            border: 3px solid #4ade80;
            color: #4ade80;
            font-family: 'Press Start 2P', monospace;
            font-size: 10px;
            outline: none;
            transition: all 0.1s steps(2);
            image-rendering: pixelated;
        }
        
        .input-row input:focus {
            border-color: #22c55e;
            box-shadow: 0 0 20px rgba(74, 222, 128, 0.2);
        }
        
        .input-row input::placeholder {
            color: rgba(74, 222, 128, 0.3);
        }
        
        .input-row button {
            padding: 12px 20px;
            background: #4ade80;
            color: #0a0a1a;
            border: 3px solid #22c55e;
            font-family: 'Press Start 2P', monospace;
            font-size: 10px;
            cursor: pointer;
            transition: all 0.1s steps(2);
            image-rendering: pixelated;
            white-space: nowrap;
        }
        
        .input-row button:hover:not(:disabled) {
            background: #22c55e;
            transform: scale(0.95);
        }
        
        .input-row button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        
        /* ===== TOOLS BAR ===== */
        .tools-bar {
            display: flex;
            gap: 4px;
            padding: 8px 0 0;
            flex-wrap: wrap;
        }
        
        .tools-bar button {
            padding: 6px 12px;
            background: #0a0a1a;
            border: 2px solid #4ade80;
            color: #4ade80;
            font-family: 'Press Start 2P', monospace;
            font-size: 7px;
            cursor: pointer;
            transition: all 0.1s steps(2);
            image-rendering: pixelated;
        }
        
        .tools-bar button:hover {
            background: #4ade80;
            color: #0a0a1a;
            transform: scale(0.95);
        }
        
        .tools-bar button.ai-btn {
            border-color: #f472b6;
            color: #f472b6;
        }
        
        .tools-bar button.ai-btn:hover {
            background: #f472b6;
            color: #0a0a1a;
        }
        
        /* ===== AI MODEL SELECTOR ===== */
        .model-selector {
            display: flex;
            gap: 4px;
            padding: 4px 0;
            align-items: center;
            flex-wrap: wrap;
        }
        
        .model-selector label {
            font-size: 7px;
            color: #4ade80;
            letter-spacing: 1px;
        }
        
        .model-selector select {
            background: #0a0a1a;
            border: 2px solid #4ade80;
            color: #4ade80;
            font-family: 'Press Start 2P', monospace;
            font-size: 7px;
            padding: 4px 8px;
            outline: none;
            image-rendering: pixelated;
            cursor: pointer;
        }
        
        .model-selector select option {
            background: #0a0a1a;
        }
        
        /* ===== TOAST ===== */
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #0a0a1a;
            border: 3px solid #4ade80;
            padding: 12px 24px;
            color: #4ade80;
            font-family: 'Press Start 2P', monospace;
            font-size: 8px;
            opacity: 0;
            transition: opacity 0.1s steps(2);
            z-index: 1000;
            pointer-events: none;
            image-rendering: pixelated;
            max-width: 90%;
            text-align: center;
        }
        
        .toast.show {
            opacity: 1;
        }
        
        .toast.error {
            border-color: #ef4444;
            color: #ef4444;
        }
        
        /* ===== MODAL ===== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(10, 10, 26, 0.9);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            image-rendering: pixelated;
        }
        
        .modal-overlay.show {
            display: flex;
        }
        
        .modal {
            background: #16213e;
            border: 4px solid #4ade80;
            padding: 24px;
            max-width: 420px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 0 40px rgba(74, 222, 128, 0.2);
        }
        
        .modal h3 {
            color: #4ade80;
            font-size: 12px;
            margin-bottom: 16px;
            letter-spacing: 2px;
        }
        
        .modal textarea {
            width: 100%;
            min-height: 150px;
            padding: 12px;
            background: #0a0a1a;
            border: 3px solid #4ade80;
            color: #4ade80;
            font-family: 'Press Start 2P', monospace;
            font-size: 9px;
            resize: vertical;
            outline: none;
        }
        
        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 16px;
            justify-content: flex-end;
        }
        
        .modal-actions button {
            padding: 10px 20px;
            font-family: 'Press Start 2P', monospace;
            font-size: 8px;
            border: 3px solid;
            cursor: pointer;
            transition: all 0.1s steps(2);
            image-rendering: pixelated;
        }
        
        .modal-actions .btn-primary {
            background: #4ade80;
            color: #0a0a1a;
            border-color: #22c55e;
        }
        
        .modal-actions .btn-primary:hover {
            background: #22c55e;
            transform: scale(0.95);
        }
        
        .modal-actions .btn-secondary {
            background: #0a0a1a;
            color: #4ade80;
            border-color: #4ade80;
        }
        
        .modal-actions .btn-secondary:hover {
            background: #1a1a2e;
            transform: scale(0.95);
        }
        
        /* ===== CONFIG SECTION ===== */
        .config-section {
            padding: 6px 0 0;
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }
        
        .config-section label {
            font-size: 7px;
            color: rgba(74, 222, 128, 0.6);
            letter-spacing: 1px;
        }
        
        .config-section input {
            background: #0a0a1a;
            border: 2px solid #4ade80;
            color: #4ade80;
            font-family: 'Press Start 2P', monospace;
            font-size: 7px;
            padding: 4px 8px;
            outline: none;
            width: 200px;
            image-rendering: pixelated;
        }
        
        /* ===== RESPONSIVE ===== */
        @media (max-width: 480px) {
            .app-container {
                border-radius: 0;
                height: 100vh;
                max-width: 100%;
                border-width: 4px;
            }
            
            .header h1 {
                font-size: 10px;
            }
            
            .message-bubble {
                font-size: 9px;
                padding: 10px 12px;
            }
            
            .input-row input {
                font-size: 8px;
                padding: 10px 12px;
            }
            
            .input-row button {
                font-size: 8px;
                padding: 10px 14px;
            }
            
            .config-section input {
                width: 120px;
                font-size: 6px;
            }
        }
        
        /* ===== SCROLLBAR PIXEL ===== */
        ::-webkit-scrollbar {
            width: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: #0a0a1a;
        }
        
        ::-webkit-scrollbar-thumb {
            background: #4ade80;
            border: 2px solid #0a0a1a;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- HEADER -->
        <div class="header">
            <h1>
                <span class="pixel-icon">🕹️</span>
                LINE BOT
            </h1>
            <div class="header-status">
                <span class="status-dot"></span>
                <span id="statusText">ONLINE</span>
            </div>
        </div>
        
        <!-- CHAT AREA -->
        <div class="chat-area" id="chatArea">
            <div class="message received">
                <div class="message-bubble">
                    🎮 PIXEL BOT ONLINE!<br>
                    <span style="font-size:8px;opacity:0.7;">
                        🔹 ตั้งค่า URL Web App ด้านล่าง<br>
                        🔹 พิมพ์ข้อความหรือใช้ AI
                    </span>
                </div>
            </div>
        </div>
        
        <!-- INPUT AREA -->
        <div class="input-area">
            <!-- Config: Web App URL -->
            <div class="config-section">
                <label>🔗 WEB APP:</label>
                <input type="text" id="webAppUrl" 
                       placeholder="https://script.google.com/.../exec"
                       value="">
                <button onclick="saveConfig()" style="padding:4px 12px;background:#4ade80;color:#0a0a1a;border:2px solid #22c55e;font-family:'Press Start 2P',monospace;font-size:7px;cursor:pointer;">SAVE</button>
            </div>
            
            <!-- AI Model Selector -->
            <div class="model-selector">
                <label>🤖 AI:</label>
                <select id="aiModelSelect">
                    <option value="gemini-1.5-flash">⚡ Flash</option>
                    <option value="gemini-1.5-pro">💎 Pro</option>
                    <option value="gemini-1.0-pro">🔮 1.0 Pro</option>
                </select>
                <label style="margin-left:8px;">🌡️</label>
                <select id="aiTempSelect">
                    <option value="0.3">❄️ Cool</option>
                    <option value="0.7" selected>🌤️ Balanced</option>
                    <option value="1.0">🔥 Creative</option>
                </select>
            </div>
            
            <div class="input-row">
                <input type="text" id="messageInput" 
                       placeholder="พิมพ์ข้อความ..." 
                       onkeypress="if(event.key === 'Enter') sendMessage()">
                <button id="sendBtn" onclick="sendMessage()">SEND</button>
            </div>
            
            <div class="tools-bar">
                <button onclick="sendWithAI()" class="ai-btn">🤖 AI Reply</button>
                <button onclick="sendFlexMessage()">📊 FLEX</button>
                <button onclick="broadcastMessage()">📢 BROAD</button>
                <button onclick="getProfile()">👤 PROFILE</button>
                <button onclick="getFollowers()">👥 FOLLOW</button>
                <button onclick="getQuota()">📊 QUOTA</button>
                <button onclick="showFlexBuilder()">✏️ BUILD</button>
                <button onclick="clearChat()">🗑️ CLEAR</button>
            </div>
        </div>
    </div>

    <!-- MODAL -->
    <div class="modal-overlay" id="flexModal">
        <div class="modal">
            <h3>✏️ FLEX BUILDER</h3>
            <textarea id="flexJsonInput" placeholder='{"type":"bubble","body":{"type":"box","layout":"vertical","contents":[{"type":"text","text":"Hello!"}]}}'></textarea>
            <div class="modal-actions">
                <button class="btn-secondary" onclick="closeFlexBuilder()">CANCEL</button>
                <button class="btn-primary" onclick="sendCustomFlex()">SEND</button>
            </div>
        </div>
    </div>

    <!-- TOAST -->
    <div class="toast" id="toast"></div>

    <script>
        // ===== CONFIG =====
        const AI_MODELS = {
            'gemini-1.5-flash': '⚡ Flash',
            'gemini-1.5-pro': '💎 Pro', 
            'gemini-1.0-pro': '🔮 1.0 Pro'
        };
        
        // ===== DOM REFS =====
        const chatArea = document.getElementById('chatArea');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const aiModelSelect = document.getElementById('aiModelSelect');
        const aiTempSelect = document.getElementById('aiTempSelect');
        const webAppUrlInput = document.getElementById('webAppUrl');
        
        // ===== STORAGE =====
        function loadConfig() {
            const saved = localStorage.getItem('pixelBotWebAppUrl');
            if (saved) {
                webAppUrlInput.value = saved;
            }
        }
        
        function saveConfig() {
            const url = webAppUrlInput.value.trim();
            if (url) {
                localStorage.setItem('pixelBotWebAppUrl', url);
                showToast('✅ URL saved!');
                checkStatus();
            } else {
                showToast('⚠️ Please enter Web App URL', 'error');
            }
        }
        
        function getWebAppUrl() {
            let url = webAppUrlInput.value.trim();
            if (!url) {
                url = localStorage.getItem('pixelBotWebAppUrl') || '';
            }
            return url;
        }
        
        // ===== API CALL =====
        async function callWebApp(action, payload = {}) {
            const url = getWebAppUrl();
            if (!url) {
                throw new Error('⚠️ กรุณาตั้งค่า Web App URL ก่อนใช้งาน');
            }
            
            const response = await fetch(url, {
                method: 'POST',
                mode: 'cors',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    action: action,
                    payload: payload
                })
            });
            
            if (!response.ok) {
                const text = await response.text();
                throw new Error(`HTTP ${response.status}: ${text}`);
            }
            
            return await response.json();
        }
        
        // ===== UTILITY =====
        function getTimestamp() {
            const now = new Date();
            return String(now.getHours()).padStart(2,'0') + ':' + 
                   String(now.getMinutes()).padStart(2,'0');
        }
        
        function showToast(message, type = 'info') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast' + (type === 'error' ? ' error' : '');
            toast.classList.add('show');
            clearTimeout(toast._timer);
            toast._timer = setTimeout(() => toast.classList.remove('show'), 3000);
        }
        
        function addMessage(text, type = 'received', meta = '') {
            const div = document.createElement('div');
            div.className = `message ${type}`;
            div.innerHTML = `
                <div class="message-bubble">
                    ${text}
                    ${meta ? `<div class="message-meta">${meta}</div>` : ''}
                    <div class="timestamp">${getTimestamp()}</div>
                </div>
            `;
            chatArea.appendChild(div);
            chatArea.scrollTop = chatArea.scrollHeight;
            return div;
        }
        
        function addTyping() {
            const div = document.createElement('div');
            div.className = 'message received';
            div.id = 'typingIndicator';
            div.innerHTML = `
                <div class="typing-indicator">
                    <div class="typing-dots">
                        <span></span><span></span><span></span>
                    </div>
                </div>
            `;
            chatArea.appendChild(div);
            chatArea.scrollTop = chatArea.scrollHeight;
        }
        
        function removeTyping() {
            const typing = document.getElementById('typingIndicator');
            if (typing) typing.remove();
        }

        // ===== SEND MESSAGE =====
        async function sendMessage() {
            const text = messageInput.value.trim();
            if (!text) return;
            
            addMessage(text, 'sent');
            messageInput.value = '';
            sendBtn.disabled = true;
            
            try {
                const data = await callWebApp('sendText', { message: text });
                if (data.success) {
                    addMessage('✅ SENT!', 'received', '📤 Message delivered');
                    showToast('✅ Message sent!');
                } else {
                    addMessage(`❌ ${data.error || 'ERROR'}`, 'received');
                    showToast('❌ Send failed', 'error');
                }
            } catch (error) {
                addMessage(`❌ ${error.message}`, 'received');
                showToast('❌ Connection error', 'error');
            } finally {
                sendBtn.disabled = false;
            }
        }

        // ===== SEND WITH AI =====
        async function sendWithAI() {
            const text = messageInput.value.trim();
            if (!text) {
                showToast('⚠️ Type a message first!', 'error');
                return;
            }
            
            const model = aiModelSelect.value;
            const modelName = AI_MODELS[model] || model;
            
            addMessage(`🤖 Asking ${modelName}...`, 'sent');
            messageInput.value = '';
            addTyping();
            
            try {
                const data = await callWebApp('sendWithAI', { 
                    message: text,
                    model: model
                });
                removeTyping();
                
                if (data.success) {
                    addMessage(`🤖 ${data.aiResponse}`, 'received', `🧠 ${modelName}`);
                    showToast(`✅ AI replied with ${modelName}`);
                } else {
                    addMessage(`❌ AI Error: ${data.error}`, 'received');
                    showToast('❌ AI failed', 'error');
                }
            } catch (error) {
                removeTyping();
                addMessage(`❌ ${error.message}`, 'received');
                showToast('❌ AI error', 'error');
            }
        }

        // ===== GET PROFILE =====
        async function getProfile() {
            addMessage('🔍 FETCHING PROFILE...', 'received');
            addTyping();
            
            try {
                const data = await callWebApp('getProfile', {});
                removeTyping();
                
                if (data.success && data.profile) {
                    const p = data.profile;
                    addMessage(`
                        👤 ${p.displayName || 'N/A'}<br>
                        📱 ${p.userId || 'N/A'}<br>
                        🌐 ${p.language || 'N/A'}<br>
                        💬 ${p.statusMessage || 'No status'}
                        ${p.pictureUrl ? `<br><img src="${p.pictureUrl}" style="width:32px;image-rendering:pixelated;border:2px solid #4ade80;margin-top:4px;">` : ''}
                    `, 'received', '👤 PROFILE');
                    showToast('✅ Profile loaded');
                } else {
                    addMessage(`❌ ${data.error || 'Unknown error'}`, 'received');
                }
            } catch (error) {
                removeTyping();
                addMessage(`❌ ${error.message}`, 'received');
                showToast('❌ Profile error', 'error');
            }
        }

        // ===== GET FOLLOWERS =====
        async function getFollowers() {
            addMessage('👥 FETCHING FOLLOWERS...', 'received');
            addTyping();
            
            try {
                const data = await callWebApp('getFollowers', { limit: 20 });
                removeTyping();
                
                if (data.success && data.data) {
                    const userIds = data.data.userIds || [];
                    const next = data.data.next || 'END';
                    addMessage(`
                        📊 ${userIds.length} FOLLOWERS<br>
                        🔄 NEXT: ${next}<br>
                        ${userIds.slice(0, 5).map(id => `📱 ${id}`).join('<br>')}
                        ${userIds.length > 5 ? `<br>... +${userIds.length - 5} more` : ''}
                    `, 'received', '👥 FOLLOWERS');
                    showToast(`✅ ${userIds.length} followers`);
                } else {
                    addMessage(`❌ ${data.error || 'Unknown'}`, 'received');
                }
            } catch (error) {
                removeTyping();
                addMessage(`❌ ${error.message}`, 'received');
                showToast('❌ Followers error', 'error');
            }
        }

        // ===== BROADCAST =====
        async function broadcastMessage() {
            const text = prompt('📢 BROADCAST MESSAGE:', 'Pixel Bot says hello!');
            if (!text) return;
            
            addMessage(`📢 BROADCAST: "${text}"`, 'received');
            addTyping();
            
            try {
                const data = await callWebApp('broadcast', { message: text });
                removeTyping();
                
                if (data.success) {
                    addMessage('✅ BROADCAST SENT!', 'received');
                    showToast('✅ Broadcast sent');
                } else {
                    addMessage(`❌ ${data.error}`, 'received');
                    showToast('❌ Broadcast failed', 'error');
                }
            } catch (error) {
                removeTyping();
                addMessage(`❌ ${error.message}`, 'received');
                showToast('❌ Broadcast error', 'error');
            }
        }

        // ===== SEND FLEX =====
        async function sendFlexMessage() {
            const sampleFlex = {
                type: 'bubble',
                body: {
                    type: 'box',
                    layout: 'vertical',
                    contents: [
                        { type: 'text', text: '🎮 PIXEL FLEX!', weight: 'bold', size: 'xl', color: '#4ade80' },
                        { type: 'text', text: 'Powered by MCP', size: 'sm', color: '#666', margin: 'md' },
                        { type: 'separator', margin: 'md' },
                        { type: 'text', text: '✅ Pixel Perfect!', size: 'sm', color: '#333', margin: 'md' }
                    ]
                }
            };
            
            addMessage('📊 SENDING FLEX...', 'received');
            addTyping();
            
            try {
                const data = await callWebApp('sendFlex', { 
                    altText: 'Pixel Flex',
                    contents: JSON.stringify(sampleFlex)
                });
                removeTyping();
                
                if (data.success) {
                    addMessage('✅ FLEX SENT!', 'received');
                    showToast('✅ Flex sent');
                } else {
                    addMessage(`❌ ${data.error}`, 'received');
                    showToast('❌ Flex failed', 'error');
                }
            } catch (error) {
                removeTyping();
                addMessage(`❌ ${error.message}`, 'received');
                showToast('❌ Flex error', 'error');
            }
        }

        // ===== GET QUOTA =====
        async function getQuota() {
            addMessage('📊 CHECKING QUOTA...', 'received');
            addTyping();
            
            try {
                const data = await callWebApp('getQuota', {});
                removeTyping();
                
                if (data.success && data.quota) {
                    const q = data.quota;
                    const remaining = (q.limit != null && q.used != null) ? q.limit - q.used : 'N/A';
                    addMessage(`
                        📊 MESSAGE QUOTA<br>
                        📈 LIMIT: ${q.limit ?? 'N/A'}<br>
                        📉 USED: ${q.used ?? 'N/A'}<br>
                        📊 REMAINING: ${remaining}
                    `, 'received', '📊 QUOTA');
                    showToast('✅ Quota checked');
                } else {
                    addMessage(`❌ ${data.error || 'Unknown'}`, 'received');
                }
            } catch (error) {
                removeTyping();
                addMessage(`❌ ${error.message}`, 'received');
                showToast('❌ Quota error', 'error');
            }
        }

        // ===== FLEX BUILDER =====
        function showFlexBuilder() {
            document.getElementById('flexModal').classList.add('show');
            document.getElementById('flexJsonInput').value = JSON.stringify({
                type: 'bubble',
                body: {
                    type: 'box',
                    layout: 'vertical',
                    contents: [
                        { type: 'text', text: '🎮 PIXEL', weight: 'bold', size: 'xl' },
                        { type: 'text', text: 'Flex Message', size: 'sm', color: '#666' }
                    ]
                }
            }, null, 2);
        }
        
        function closeFlexBuilder() {
            document.getElementById('flexModal').classList.remove('show');
        }
        
        async function sendCustomFlex() {
            const jsonInput = document.getElementById('flexJsonInput');
            let contentsStr;
            try {
                JSON.parse(jsonInput.value);
                contentsStr = jsonInput.value;
            } catch (e) {
                showToast('❌ Invalid JSON', 'error');
                addMessage(`❌ JSON ERROR: ${e.message}`, 'received');
                return;
            }
            
            closeFlexBuilder();
            addMessage('📊 SENDING CUSTOM FLEX...', 'received');
            addTyping();
            
            try {
                const data = await callWebApp('sendFlex', {
                    altText: 'Custom Flex',
                    contents: contentsStr
                });
                removeTyping();
                
                if (data.success) {
                    addMessage('✅ CUSTOM FLEX SENT!', 'received');
                    showToast('✅ Custom flex sent');
                } else {
                    addMessage(`❌ ${data.error}`, 'received');
                    showToast('❌ Send failed', 'error');
                }
            } catch (error) {
                removeTyping();
                addMessage(`❌ ${error.message}`, 'received');
                showToast('❌ Send error', 'error');
            }
        }

        // ===== CLEAR CHAT =====
        function clearChat() {
            chatArea.innerHTML = `
                <div class="message received">
                    <div class="message-bubble">
                        🗑️ CHAT CLEARED<br>
                        <span style="font-size:8px;opacity:0.7;">Ready for action!</span>
                    </div>
                </div>
            `;
            showToast('🗑️ Chat cleared');
        }

        // ===== CHECK STATUS =====
        async function checkStatus() {
            try {
                const data = await callWebApp('status', {});
                document.getElementById('statusText').textContent = data.status === 'online' ? 'ONLINE' : 'OFFLINE';
                if (data.aiConfigured) {
                    document.getElementById('statusText').textContent += ' 🤖';
                }
            } catch (e) {
                document.getElementById('statusText').textContent = 'OFFLINE';
                showToast('⚠️ Server offline', 'error');
            }
        }

        // ===== INIT =====
        loadConfig();
        
        // Auto-check status after 2 seconds
        setTimeout(() => {
            if (getWebAppUrl()) {
                checkStatus();
            }
        }, 2000);

        // ===== KEYBOARD SHORTCUTS =====
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && e.ctrlKey) {
                sendWithAI();
                e.preventDefault();
            }
        });

        console.log('🎮 PIXEL BOT MCP READY');
        console.log('🤖 AI Models:', Object.keys(AI_MODELS).join(', '));
        console.log('⌨️ Ctrl+Enter = AI Reply');
        console.log('🔗 ตั้งค่า Web App URL ในช่องด้านบน');
    </script>
</body>
</html>
