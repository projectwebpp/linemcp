<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LINE Bot - Dashboard</title>
    <style>
        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #0d1117;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* ===== MAIN CONTAINER ===== */
        .app-container {
            width: 100%;
            max-width: 580px;
            background: #161b22;
            border-radius: 16px;
            border: 1px solid #30363d;
            padding: 28px 28px 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }

        /* ===== HEADER ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 18px;
            border-bottom: 1px solid #30363d;
            margin-bottom: 20px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-left .icon {
            font-size: 28px;
        }

        .header-left h1 {
            font-size: 20px;
            font-weight: 700;
            color: #f0f6fc;
            letter-spacing: -0.5px;
        }

        .header-left h1 span {
            color: #58a6ff;
        }

        .header-status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: #8b949e;
            background: #21262d;
            padding: 4px 14px;
            border-radius: 20px;
            border: 1px solid #30363d;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
            background: #8b949e;
        }

        .status-dot.online {
            background: #3fb950;
            box-shadow: 0 0 8px rgba(63, 185, 80, 0.3);
        }

        .status-dot.offline {
            background: #f85149;
        }

        /* ===== CONFIG SECTION ===== */
        .config-section {
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 10px;
            padding: 14px 16px;
            margin-bottom: 16px;
        }

        .config-section label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            color: #8b949e;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }

        .config-row {
            display: flex;
            gap: 10px;
        }

        .config-row input {
            flex: 1;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 10px 14px;
            color: #f0f6fc;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .config-row input::placeholder {
            color: #484f58;
        }

        .config-row input:focus {
            border-color: #58a6ff;
            box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.1);
        }

        .config-row button {
            padding: 10px 22px;
            background: #21262d;
            border: 1px solid #30363d;
            border-radius: 8px;
            color: #c9d1d9;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .config-row button:hover {
            background: #30363d;
            border-color: #58a6ff;
            color: #f0f6fc;
        }

        /* ===== AI MODEL SELECTOR ===== */
        .model-selector {
            display: flex;
            gap: 14px;
            align-items: center;
            flex-wrap: wrap;
            padding: 8px 0 4px;
        }

        .model-selector .group {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .model-selector label {
            font-size: 11px;
            color: #8b949e;
            font-weight: 500;
        }

        .model-selector select {
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 6px 12px;
            color: #f0f6fc;
            font-size: 13px;
            outline: none;
            cursor: pointer;
        }

        .model-selector select:focus {
            border-color: #58a6ff;
        }

        .model-selector select option {
            background: #161b22;
        }

        /* ===== CHAT AREA ===== */
        .chat-area {
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 10px;
            padding: 16px;
            height: 300px;
            overflow-y: auto;
            margin-bottom: 16px;
        }

        .chat-area::-webkit-scrollbar {
            width: 5px;
        }

        .chat-area::-webkit-scrollbar-track {
            background: transparent;
        }

        .chat-area::-webkit-scrollbar-thumb {
            background: #30363d;
            border-radius: 10px;
        }

        /* ===== MESSAGES ===== */
        .message {
            margin-bottom: 12px;
            display: flex;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.sent {
            justify-content: flex-end;
        }

        .message.received {
            justify-content: flex-start;
        }

        .message-bubble {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.5;
            word-wrap: break-word;
            position: relative;
        }

        .message.sent .message-bubble {
            background: #1f6feb;
            color: #f0f6fc;
            border-bottom-right-radius: 4px;
        }

        .message.received .message-bubble {
            background: #21262d;
            color: #c9d1d9;
            border-bottom-left-radius: 4px;
        }

        .message-bubble .time {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.4);
            margin-top: 4px;
            display: block;
        }

        .message.received .message-bubble .time {
            color: rgba(255, 255, 255, 0.25);
        }

        .message-bubble .meta {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.3);
            margin-top: 2px;
            display: block;
        }

        /* ===== TYPING ===== */
        .typing-indicator {
            padding: 10px 14px;
            background: #21262d;
            border-radius: 12px;
            display: inline-block;
            border-bottom-left-radius: 4px;
        }

        .typing-dots {
            display: flex;
            gap: 5px;
        }

        .typing-dots span {
            width: 7px;
            height: 7px;
            background: #8b949e;
            border-radius: 50%;
            display: block;
            animation: typingBounce 1.4s ease-in-out infinite;
        }

        .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
        .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typingBounce {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.3; }
            30% { transform: translateY(-6px); opacity: 1; }
        }

        /* ===== INPUT ===== */
        .input-area {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .input-row {
            display: flex;
            gap: 10px;
        }

        .input-row input {
            flex: 1;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 10px;
            padding: 12px 16px;
            color: #f0f6fc;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-row input::placeholder {
            color: #484f58;
        }

        .input-row input:focus {
            border-color: #58a6ff;
            box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.1);
        }

        .input-row button {
            padding: 12px 28px;
            background: #1f6feb;
            border: none;
            border-radius: 10px;
            color: #f0f6fc;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .input-row button:hover:not(:disabled) {
            background: #388bfd;
            transform: scale(0.98);
        }

        .input-row button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* ===== TOOLS BAR ===== */
        .tools-bar {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            padding-top: 4px;
        }

        .tools-bar button {
            padding: 5px 14px;
            background: transparent;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: #8b949e;
            font-size: 11px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tools-bar button:hover {
            background: #21262d;
            border-color: #58a6ff;
            color: #f0f6fc;
        }

        .tools-bar button.ai-btn {
            border-color: #3fb950;
            color: #3fb950;
        }

        .tools-bar button.ai-btn:hover {
            background: rgba(63, 185, 80, 0.1);
            border-color: #3fb950;
        }

        /* ===== TOAST ===== */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: #21262d;
            border: 1px solid #30363d;
            border-radius: 10px;
            padding: 12px 24px;
            color: #f0f6fc;
            font-size: 14px;
            opacity: 0;
            transition: all 0.4s ease;
            z-index: 1000;
            pointer-events: none;
            max-width: 90%;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .toast.error {
            border-color: #f85149;
            color: #f85149;
        }

        .toast.success {
            border-color: #3fb950;
            color: #3fb950;
        }

        /* ===== MODAL ===== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            backdrop-filter: blur(4px);
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 16px;
            padding: 28px;
            max-width: 500px;
            width: 92%;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
        }

        .modal h3 {
            font-size: 18px;
            font-weight: 700;
            color: #f0f6fc;
            margin-bottom: 16px;
            letter-spacing: -0.3px;
        }

        .modal textarea {
            width: 100%;
            min-height: 160px;
            padding: 14px;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 10px;
            color: #f0f6fc;
            font-size: 14px;
            font-family: 'SF Mono', 'Consolas', monospace;
            resize: vertical;
            outline: none;
        }

        .modal textarea:focus {
            border-color: #58a6ff;
            box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.1);
        }

        .modal-actions {
            display: flex;
            gap: 12px;
            margin-top: 18px;
            justify-content: flex-end;
        }

        .modal-actions button {
            padding: 10px 24px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
        }

        .modal-actions .btn-primary {
            background: #1f6feb;
            color: #f0f6fc;
        }

        .modal-actions .btn-primary:hover {
            background: #388bfd;
        }

        .modal-actions .btn-secondary {
            background: #21262d;
            color: #8b949e;
        }

        .modal-actions .btn-secondary:hover {
            background: #30363d;
            color: #f0f6fc;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 500px) {
            body { padding: 10px; }
            .app-container { padding: 16px; }
            .header-left h1 { font-size: 17px; }
            .header-status { font-size: 10px; padding: 3px 10px; }
            .chat-area { height: 220px; }
            .input-row input { font-size: 13px; padding: 10px 14px; }
            .input-row button { padding: 10px 18px; font-size: 13px; }
            .config-row input { font-size: 12px; }
            .tools-bar button { font-size: 10px; padding: 4px 10px; }
            .modal { padding: 20px; }
        }

        /* ===== SCROLLBAR ===== */
        ::-webkit-scrollbar {
            width: 5px;
        }
        ::-webkit-scrollbar-track {
            background: #0d1117;
        }
        ::-webkit-scrollbar-thumb {
            background: #30363d;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- HEADER -->
        <div class="header">
            <div class="header-left">
                <span class="icon">💬</span>
                <h1>LINE <span>Bot</span></h1>
            </div>
            <div class="header-status">
                <span class="status-dot" id="statusDot"></span>
                <span id="statusText">Ready</span>
            </div>
        </div>

        <!-- CONFIG -->
        <div class="config-section">
            <label>🔗 Web App Endpoint</label>
            <div class="config-row">
                <input type="text" id="webAppUrl" 
                       placeholder="https://script.google.com/macros/s/.../exec">
                <button onclick="saveConfig()">Set</button>
            </div>
        </div>

        <!-- AI MODEL -->
        <div class="model-selector">
            <div class="group">
                <label>🤖 Model</label>
                <select id="aiModelSelect">
                    <option value="gemini-1.5-flash">Flash</option>
                    <option value="gemini-1.5-pro">Pro</option>
                    <option value="gemini-1.0-pro">1.0 Pro</option>
                </select>
            </div>
            <div class="group">
                <label>🌡️ Temp</label>
                <select id="aiTempSelect">
                    <option value="0.3">Cool</option>
                    <option value="0.7" selected>Balanced</option>
                    <option value="1.0">Creative</option>
                </select>
            </div>
            <div class="group" style="margin-left:auto;">
                <span id="aiStatus" style="font-size:12px;color:#8b949e;">AI: ⚡</span>
            </div>
        </div>

        <!-- CHAT -->
        <div class="chat-area" id="chatArea">
            <div class="message received">
                <div class="message-bubble">
                    Welcome!<br>
                    <span style="font-size:12px;opacity:0.6;">
                        Set your Web App URL to begin.
                    </span>
                </div>
            </div>
        </div>

        <!-- INPUT -->
        <div class="input-area">
            <div class="input-row">
                <input type="text" id="messageInput" 
                       placeholder="Type your message..."
                       onkeypress="if(event.key === 'Enter') sendMessage()">
                <button id="sendBtn" onclick="sendMessage()">Send</button>
            </div>
            <div class="tools-bar">
                <button onclick="sendWithAI()" class="ai-btn">🤖 AI Reply</button>
                <button onclick="sendFlexMessage()">📊 Flex</button>
                <button onclick="broadcastMessage()">📢 Broadcast</button>
                <button onclick="getProfile()">👤 Profile</button>
                <button onclick="getFollowers()">👥 Followers</button>
                <button onclick="getQuota()">📊 Quota</button>
                <button onclick="showFlexBuilder()">✏️ Builder</button>
                <button onclick="clearChat()">🗑️ Clear</button>
            </div>
        </div>
    </div>

    <!-- MODAL -->
    <div class="modal-overlay" id="flexModal">
        <div class="modal">
            <h3>✏️ Flex Builder</h3>
            <textarea id="flexJsonInput" placeholder='{"type":"bubble","body":{"type":"box","layout":"vertical","contents":[{"type":"text","text":"Hello!"}]}}'></textarea>
            <div class="modal-actions">
                <button class="btn-secondary" onclick="closeFlexBuilder()">Cancel</button>
                <button class="btn-primary" onclick="sendCustomFlex()">Send</button>
            </div>
        </div>
    </div>

    <!-- TOAST -->
    <div class="toast" id="toast"></div>

    <script>
        // ===== CONFIG =====
        const AI_MODELS = {
            'gemini-1.5-flash': '⚡ Flash',
            'gemini-1.5-pro': '💎 Pro',
            'gemini-1.0-pro': '🔮 1.0 Pro'
        };

        // ===== DOM REFS =====
        const chatArea = document.getElementById('chatArea');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const aiModelSelect = document.getElementById('aiModelSelect');
        const aiTempSelect = document.getElementById('aiTempSelect');
        const webAppUrlInput = document.getElementById('webAppUrl');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const aiStatus = document.getElementById('aiStatus');

        // ===== STORAGE =====
        function loadConfig() {
            const saved = localStorage.getItem('lineBotWebAppUrl');
            if (saved) {
                webAppUrlInput.value = saved;
                setTimeout(checkStatus, 1000);
            }
        }

        function saveConfig() {
            const url = webAppUrlInput.value.trim();
            if (url) {
                localStorage.setItem('lineBotWebAppUrl', url);
                showToast('✅ Endpoint saved', 'success');
                checkStatus();
            } else {
                showToast('⚠️ Please enter a valid URL', 'error');
            }
        }

        function getWebAppUrl() {
            let url = webAppUrlInput.value.trim();
            if (!url) {
                url = localStorage.getItem('lineBotWebAppUrl') || '';
            }
            return url;
        }

        // ===== API CALL =====
        async function callWebApp(action, payload = {}) {
            const url = getWebAppUrl();
            if (!url) {
                throw new Error('⚠️ Please set Web App URL first');
            }

            const response = await fetch(url, {
                method: 'POST',
                mode: 'cors',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    action: action,
                    payload: payload
                })
            });

            if (!response.ok) {
                const text = await response.text();
                throw new Error(`HTTP ${response.status}: ${text}`);
            }

            return await response.json();
        }

        // ===== UTILITY =====
        function getTimestamp() {
            const now = new Date();
            return String(now.getHours()).padStart(2, '0') + ':' +
                   String(now.getMinutes()).padStart(2, '0');
        }

        function showToast(message, type = 'info') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast ' + type;
            toast.classList.add('show');
            clearTimeout(toast._timer);
            toast._timer = setTimeout(() => toast.classList.remove('show'), 3000);
        }

        function addMessage(text, type = 'received', meta = '') {
            const div = document.createElement('div');
            div.className = `message ${type}`;
            div.innerHTML = `
                <div class="message-bubble">
                    ${text}
                    ${meta ? `<span class="meta">${meta}</span>` : ''}
                    <span class="time">${getTimestamp()}</span>
                </div>
            `;
            chatArea.appendChild(div);
            chatArea.scrollTop = chatArea.scrollHeight;
            return div;
        }

        function addTyping() {
            const div = document.createElement('div');
            div.className = 'message received';
            div.id = 'typingIndicator';
            div.innerHTML = `
                <div class="typing-indicator">
                    <div class="typing-dots">
                        <span></span><span></span><span></span>
                    </div>
                </div>
            `;
            chatArea.appendChild(div);
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        function removeTyping() {
            const typing = document.getElementById('typingIndicator');
            if (typing) typing.remove();
        }

        function setStatus(status, ai = null) {
            statusText.textContent = status;
            if (status === 'Online' || status === 'online') {
                statusDot.className = 'status-dot online';
            } else if (status === 'Offline' || status === 'offline') {
                statusDot.className = 'status-dot offline';
            } else {
                statusDot.className = 'status-dot';
            }
            if (ai) {
                aiStatus.textContent = 'AI: ' + ai;
            }
        }

        // ===== SEND MESSAGE =====
        async function sendMessage() {
            const text = messageInput.value.trim();
            if (!text) return;

            addMessage(text, 'sent');
            messageInput.value = '';
            sendBtn.disabled = true;

            try {
                const data = await callWebApp('sendText', { message: text });
                if (data.success) {
                    addMessage('✅ Sent', 'received', '📤');
                    showToast('✅ Message sent', 'success');
                } else {
                    addMessage(`❌ ${data.error || 'Failed'}`, 'received');
                    showToast('❌ Send failed', 'error');
                }
            } catch (error) {
                addMessage(`❌ ${error.message}`, 'received');
                showToast('❌ Connection error', 'error');
            } finally {
                sendBtn.disabled = false;
            }
        }

        // ===== SEND WITH AI =====
        async function sendWithAI() {
            const text = messageInput.value.trim();
            if (!text) {
                showToast('⚠️ Type a message first', 'error');
                return;
            }

            const model = aiModelSelect.value;
            const modelName = AI_MODELS[model] || model;

            addMessage(`🤖 Asking ${modelName}...`, 'sent');
            messageInput.value = '';
            addTyping();

            try {
                const data = await callWebApp('sendWithAI', {
                    message: text,
                    model: model
                });
                removeTyping();

                if (data.success) {
                    addMessage(`🤖 ${data.aiResponse}`, 'received', `🧠 ${modelName}`);
                    showToast('✅ AI replied', 'success');
                } else {
                    addMessage(`❌ AI Error: ${data.error}`, 'received');
                    showToast('❌ AI failed', 'error');
                }
            } catch (error) {
                removeTyping();
                addMessage(`❌ ${error.message}`, 'received');
                showToast('❌ AI error', 'error');
            }
        }

        // ===== GET PROFILE =====
        async function getProfile() {
            addMessage('👤 Fetching profile...', 'received');
            addTyping();

            try {
                const data = await callWebApp('getProfile', {});
                removeTyping();

                if (data.success && data.profile) {
                    const p = data.profile;
                    addMessage(`
                        <strong>${p.displayName || 'N/A'}</strong><br>
                        ID: ${p.userId || 'N/A'}<br>
                        Language: ${p.language || 'N/A'}<br>
                        Status: ${p.statusMessage || '—'}
                        ${p.pictureUrl ? `<br><img src="${p.pictureUrl}" style="width:32px;border-radius:6px;margin-top:4px;">` : ''}
                    `, 'received', '👤 Profile');
                    showToast('✅ Profile loaded', 'success');
                } else {
                    addMessage(`❌ ${data.error || 'Unknown error'}`, 'received');
                }
            } catch (error) {
                removeTyping();
                addMessage(`❌ ${error.message}`, 'received');
                showToast('❌ Profile error', 'error');
            }
        }

        // ===== GET FOLLOWERS =====
        async function getFollowers() {
            addMessage('👥 Fetching followers...', 'received');
            addTyping();

            try {
                const data = await callWebApp('getFollowers', { limit: 20 });
                removeTyping();

                if (data.success && data.data) {
                    const userIds = data.data.userIds || [];
                    const next = data.data.next || 'END';
                    addMessage(`
                        <strong>${userIds.length}</strong> followers<br>
                        Next: ${next}<br>
                        ${userIds.slice(0, 5).map(id => `• ${id}`).join('<br>')}
                        ${userIds.length > 5 ? `<br>• ... +${userIds.length - 5} more` : ''}
                    `, 'received', '👥 Followers');
                    showToast(`✅ ${userIds.length} followers`, 'success');
                } else {
                    addMessage(`❌ ${data.error || 'Unknown'}`, 'received');
                }
            } catch (error) {
                removeTyping();
                addMessage(`❌ ${error.message}`, 'received');
                showToast('❌ Followers error', 'error');
            }
        }

        // ===== BROADCAST =====
        async function broadcastMessage() {
            const text = prompt('📢 Broadcast message:', 'Hello from LINE Bot!');
            if (!text) return;

            addMessage(`📢 Broadcasting: "${text}"`, 'received');
            addTyping();

            try {
                const data = await callWebApp('broadcast', { message: text });
                removeTyping();

                if (data.success) {
                    addMessage('✅ Broadcast sent', 'received');
                    showToast('✅ Broadcast sent', 'success');
                } else {
                    addMessage(`❌ ${data.error}`, 'received');
                    showToast('❌ Broadcast failed', 'error');
                }
            } catch (error) {
                removeTyping();
                addMessage(`❌ ${error.message}`, 'received');
                showToast('❌ Broadcast error', 'error');
            }
        }

        // ===== SEND FLEX =====
        async function sendFlexMessage() {
            const sampleFlex = {
                type: 'bubble',
                body: {
                    type: 'box',
                    layout: 'vertical',
                    contents: [
                        { type: 'text', text: '📊 Flex Message', weight: 'bold', size: 'xl', color: '#58a6ff' },
                        { type: 'text', text: 'From LINE Bot Dashboard', size: 'sm', color: '#8b949e', margin: 'md' },
                        { type: 'separator', margin: 'md' },
                        { type: 'text', text: '✅ Ready!', size: 'sm', color: '#3fb950', margin: 'md' }
                    ]
                }
            };

            addMessage('📊 Sending Flex...', 'received');
            addTyping();

            try {
                const data = await callWebApp('sendFlex', {
                    altText: 'Flex Message',
                    contents: JSON.stringify(sampleFlex)
                });
                removeTyping();

                if (data.success) {
                    addMessage('✅ Flex sent', 'received');
                    showToast('✅ Flex sent', 'success');
                } else {
                    addMessage(`❌ ${data.error}`, 'received');
                    showToast('❌ Flex failed', 'error');
                }
            } catch (error) {
                removeTyping();
                addMessage(`❌ ${error.message}`, 'received');
                showToast('❌ Flex error', 'error');
            }
        }

        // ===== GET QUOTA =====
        async function getQuota() {
            addMessage('📊 Checking quota...', 'received');
            addTyping();

            try {
                const data = await callWebApp('getQuota', {});
                removeTyping();

                if (data.success && data.quota) {
                    const q = data.quota;
                    const remaining = (q.limit != null && q.used != null) ? q.limit - q.used : 'N/A';
                    addMessage(`
                        <strong>Message Quota</strong><br>
                        Limit: ${q.limit ?? 'N/A'}<br>
                        Used: ${q.used ?? 'N/A'}<br>
                        Remaining: ${remaining}
                    `, 'received', '📊 Quota');
                    showToast('✅ Quota checked', 'success');
                } else {
                    addMessage(`❌ ${data.error || 'Unknown'}`, 'received');
                }
            } catch (error) {
                removeTyping();
                addMessage(`❌ ${error.message}`, 'received');
                showToast('❌ Quota error', 'error');
            }
        }

        // ===== FLEX BUILDER =====
        function showFlexBuilder() {
            document.getElementById('flexModal').classList.add('show');
            document.getElementById('flexJsonInput').value = JSON.stringify({
                type: 'bubble',
                body: {
                    type: 'box',
                    layout: 'vertical',
                    contents: [
                        { type: 'text', text: 'Hello!', weight: 'bold', size: 'xl' },
                        { type: 'text', text: 'Flex Message', size: 'sm', color: '#666' }
                    ]
                }
            }, null, 2);
        }

        function closeFlexBuilder() {
            document.getElementById('flexModal').classList.remove('show');
        }

        async function sendCustomFlex() {
            const jsonInput = document.getElementById('flexJsonInput');
            let contentsStr;
            try {
                JSON.parse(jsonInput.value);
                contentsStr = jsonInput.value;
            } catch (e) {
                showToast('❌ Invalid JSON', 'error');
                addMessage(`❌ JSON Error: ${e.message}`, 'received');
                return;
            }

            closeFlexBuilder();
            addMessage('📊 Sending custom Flex...', 'received');
            addTyping();

            try {
                const data = await callWebApp('sendFlex', {
                    altText: 'Custom Flex',
                    contents: contentsStr
                });
                removeTyping();

                if (data.success) {
                    addMessage('✅ Custom Flex sent', 'received');
                    showToast('✅ Custom flex sent', 'success');
                } else {
                    addMessage(`❌ ${data.error}`, 'received');
                    showToast('❌ Send failed', 'error');
                }
            } catch (error) {
                removeTyping();
                addMessage(`❌ ${error.message}`, 'received');
                showToast('❌ Send error', 'error');
            }
        }

        // ===== CLEAR CHAT =====
        function clearChat() {
            chatArea.innerHTML = `
                <div class="message received">
                    <div class="message-bubble">
                        🗑️ Chat cleared<br>
                        <span style="font-size:12px;opacity:0.6;">Ready</span>
                    </div>
                </div>
            `;
            showToast('🗑️ Chat cleared', 'info');
        }

        // ===== CHECK STATUS =====
        async function checkStatus() {
            try {
                const data = await callWebApp('status', {});
                if (data.status === 'online') {
                    setStatus('Online', data.aiConfigured ? '⚡' : '—');
                } else {
                    setStatus('Offline');
                }
            } catch (e) {
                setStatus('Offline');
                if (getWebAppUrl()) {
                    showToast('⚠️ Server offline', 'error');
                }
            }
        }

        // ===== INIT =====
        loadConfig();
        setStatus('Ready');

        setTimeout(() => {
            if (getWebAppUrl()) {
                checkStatus();
            }
        }, 2000);

        // ===== KEYBOARD SHORTCUTS =====
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && e.ctrlKey) {
                sendWithAI();
                e.preventDefault();
            }
        });

        console.log('💬 LINE Bot Dashboard initialized');
        console.log('⌨️ Ctrl+Enter = AI Reply');
        console.log('🔗 Set your Web App URL above');
    </script>
</body>
</html>
